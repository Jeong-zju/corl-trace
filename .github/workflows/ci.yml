name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Python checks and CPU helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      WANDB_MODE: disabled
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-test.txt
      - name: Install lightweight dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-test.txt
      - name: Check Python correctness
        run: python -m ruff check .
      - name: Check release metadata and tracked files
        run: python scripts/check_release.py
      - name: Test CPU helpers without datasets or model downloads
        run: python -m pytest --lightweight
