# The repository contains research entry points and two installable policy
# packages. Install those packages with requirements.txt, not `pip install .`.
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = [
    ".",
    "scripts",
    "data",
    "policy/lerobot_policy_streaming_act/src",
    "policy/lerobot_policy_prism_diffusion/src",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "depends",
    "outputs",
    "wandb",
    "data/lerobot",
    "data/robocasa",
]

[tool.ruff.lint]
# Catch syntax errors, undefined names, invalid comparisons and control flow
# without rewriting the formatting of the validated research implementation.
select = ["E9", "F63", "F7", "F82"]

