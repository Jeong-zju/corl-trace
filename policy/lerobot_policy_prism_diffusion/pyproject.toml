[project]
name = "lerobot_policy_prism_diffusion"
version = "0.1.0"
description = "Full TRACE policy with a diffusion decoder for LeRobot."
dependencies = [
    "lerobot==0.5.0",
    "lerobot_policy_streaming_act==0.1.0",
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
