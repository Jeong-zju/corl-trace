# Full TRACE with the Diffusion Policy interface. Reference recipe only.
# Supply your local LeRobot v3 dataset with --dataset.
train:
  output_root: outputs/train/trace-diffusion
  job_name: trace-diffusion
  device: cuda
  seed: 42
  steps: 100000
  batch_size: 8
  num_workers: 4
  log_freq: 100
  save_freq: 10000
  eval_freq: -1
  enable_wandb: false
  wandb_mode: disabled
  test_ratio: 0.2
  split_seed: 42
  split_shuffle: true
  n_obs_steps: 2
  horizon: 56
  n_action_steps: 50
  drop_n_last_frames: 5
  signature_depth: 3
  signature_hidden_dim: 512
  signature_dropout: 0.1
  prefix_train_max_steps: 32
  prefix_frame_stride: 4
  slot_memory_num_slots: 4
  slot_memory_routing_hidden_dim: 512
  prism_adapter_hidden_dim: 512
  prism_adapter_zero_init: true

eval:
  train_output_root: outputs/train/trace-diffusion
  output_dir: outputs/eval/trace-diffusion/{run_tag}
  device: cuda
  eval_split: test
  seed: 42
